services:
  postgres:
    image: postgres:18.6-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en el archivo local}
    volumes:
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos_postgres:
