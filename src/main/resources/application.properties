spring.application.name=usuarios-ms
server.port=8080

# Permite usar una configuracion local que no se sube a GitHub
spring.config.import=optional:file:./application-local.properties

# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
